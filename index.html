<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打螺丝核玩工具</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1b1d22;color:#ddd;font:13px/1.4 "Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}
#app{display:flex;height:100vh;gap:14px;padding:10px}
#stageWrap{flex:1;display:flex;align-items:center;justify-content:center;min-width:0;position:relative}
#stage{height:calc(100vh - 20px);max-width:100%;aspect-ratio:9/16;background:#000;box-shadow:0 6px 30px rgba(0,0,0,.6);border-radius:6px;cursor:pointer;touch-action:none}
#panel{width:420px;flex:none;display:flex;flex-direction:column;background:#24272e;border-radius:8px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.4)}
#panelHead{padding:10px 12px;border-bottom:1px solid #333;background:#2b2f37}
#panelHead h1{font-size:15px;margin:0 0 8px;color:#ffd54a}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btns button{flex:1 1 30%}
button{background:#3a404c;color:#eee;border:1px solid #4b5260;border-radius:5px;padding:6px 8px;cursor:pointer;font:inherit;white-space:nowrap}
button:hover{background:#465060}
button.primary{background:#2e8b47;border-color:#3aa957}
button.on{background:#b33a3a;border-color:#d55}
#status{margin-top:8px;color:#9fd;font-size:12px}
#recInfo{color:#f99;font-size:12px;margin-top:4px}
#recList a{display:block;color:#8cf;font-size:12px;margin-top:3px;word-break:break-all}
#panelBody{overflow-y:auto;flex:1;padding:6px 10px 30px}
details{border:1px solid #353a44;border-radius:6px;margin:8px 0;background:#2a2e36}
summary{cursor:pointer;padding:8px 10px;font-weight:bold;color:#ffd98a;user-select:none}
.row{display:flex;align-items:center;gap:6px;padding:4px 10px}
.row label{flex:0 0 150px;color:#c8ccd4;font-size:12px}
.row input[type=range]{flex:1;min-width:60px}
.row input.val{width:64px;background:#1d2026;color:#fff;border:1px solid #444;border-radius:4px;padding:2px 4px}
.row input[type=text],.row input[type=number]:not(.val),.row select,.row textarea{flex:1;min-width:0;background:#1d2026;color:#fff;border:1px solid #444;border-radius:4px;padding:3px 5px;font:inherit}
.row input[type=color]{width:46px;height:24px;border:none;background:none;padding:0}
.row input[type=file]{flex:1;min-width:0;font-size:11px}
.row button{padding:3px 8px}
.handprev{align-items:flex-start}
#handPrev{border-radius:4px;cursor:crosshair;width:150px;height:190px}
#toast{position:absolute;top:18px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:8px 16px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
#migrateBanner{position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:50;max-width:min(860px,94vw);background:#fff8e1;color:#4a3000;border:1px solid #e0b84a;border-radius:10px;padding:10px 14px;font-size:13px;line-height:1.6;box-shadow:0 6px 24px rgba(0,0,0,.35)}
#migrateBanner button{margin-left:8px;padding:3px 10px;border-radius:6px;border:1px solid #c79a2a;background:#ffe69a;cursor:pointer}
#migrateBanner button#mbReset{background:#4caf50;color:#fff;border-color:#2e7d32}

.row.t-switch label{flex:1}
.switch{position:relative;display:inline-block;width:46px;height:28px;flex:none;cursor:pointer}
.switch .switch-input{opacity:0;width:0;height:0;position:absolute}
.switch .slider{position:absolute;inset:0;background:#555;border-radius:28px;transition:background .2s}
.switch .slider:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.switch .switch-input:checked+.slider{background:#34c759}
.switch .switch-input:checked+.slider:before{transform:translateX(18px)}
.switch .switch-input:focus-visible+.slider{outline:2px solid #8cf;outline-offset:2px}
.row.dimmed{opacity:.45;pointer-events:none}
.tip{font-size:11px;color:#888;padding:6px 10px}
</style>
</head>
<body>
<div id="app">
  <div id="stageWrap"><canvas id="stage" width="720" height="1280"></canvas><div id="toast"></div></div>
  <div id="panel">
    <div id="panelHead">
      <h1>🔩 打螺丝核玩工具 · 控制面板</h1>
      <div class="btns">
        <button id="btnAuto" class="primary">▶ 自动通关</button>
        <button id="btnRec">⏺ 开始录制</button>
        <button id="btnNew">↻ 重新开始</button>
        <button id="btnSeed">🎲 换一局</button>
        <button id="btnShot">📷 截图</button>
        <button id="btnExport">导出设置</button>
        <button id="btnImport">导入设置</button>
        <button id="btnReset">恢复默认</button>
      </div>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
      <div id="status"></div>
      <div id="recInfo"></div>
      <div id="recList"></div>
    </div>
    <div id="panelBody"></div>
  </div>
</div>
